x-booking-env: &booking-env
  DATABASE_URL: postgresql+asyncpg://booking:booking@postgres:5432/booking
  REDIS_URL: redis://redis:6379/0
  PROVIDER_URL: http://provider:8001
  CALLBACK_SECRET: ${CALLBACK_SECRET:-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  provider:
    build: ./mock_provider
    environment:
      CALLBACK_URL: http://api:8000/provider/callbacks
      CALLBACK_SECRET: ${CALLBACK_SECRET:-change-me}
    ports:
      - "${PROVIDER_PORT:-8001}:8001"

  migrate:
    build: ./booking_service
    command: ["alembic", "upgrade", "head"]
    environment: *booking-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./booking_service
    environment: *booking-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./booking_service
    command: ["python", "-m", "src.worker"]
    environment: *booking-env
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      provider:
        condition: service_started

  tests:
    build: ./booking_service
    command: ["pytest", "-v"]
    profiles: ["test"]
    environment:
      <<: *booking-env
      DATABASE_URL: postgresql+asyncpg://booking:booking@postgres:5432/booking_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
